<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fingertune — pinch-controlled rhythm game</title>
    <meta
      name="description"
      content="An Osu!-style rhythm game played by pinching your fingers, tracked from your webcam. Runs entirely in the browser."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!--
      Link preview cards.

      The URL worth posting is the game, not the repository: someone who sees a
      screenshot and a play link presses play, and someone who sees a file tree
      does not. But a link posted without these tags renders on LinkedIn, Slack
      and Discord as a grey rectangle with a domain in it, which undoes the
      choice. So the card is part of shipping the game.

      og:image has to be an absolute URL — a crawler resolves it against
      nothing — and it has to be a raster: LinkedIn will not render an SVG. The
      1200x630 PNG is drawn from assets/logo.svg by `npm run build:og`, which
      the build runs, so the card can never show a logo the site does not.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fingertune" />
    <meta property="og:url" content="https://qthullie.github.io/fingertune/" />
    <meta property="og:title" content="Fingertune — a rhythm game you play by pinching" />
    <meta
      property="og:description"
      content="Pinch your thumb and index on the beat. Hand tracked from your webcam, entirely in the browser — no upload, no account, no server."
    />
    <meta property="og:image" content="https://qthullie.github.io/fingertune/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Pixel-art card: the Fingertune sprite, an approach ring closing on a target, next to the game's name."
    />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="fr_FR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fingertune — a rhythm game you play by pinching" />
    <meta
      name="twitter:description"
      content="Pinch your thumb and index on the beat. Hand tracked from your webcam, entirely in the browser."
    />
    <meta name="twitter:image" content="https://qthullie.github.io/fingertune/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
