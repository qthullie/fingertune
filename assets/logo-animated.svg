<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="256" height="256" shape-rendering="crispEdges">
  <!--
    fingertune animated sprite — original artwork, MIT licensed with the project.

    One full note, looping: the approach ring closes on the target, the target
    flashes on the beat, then bursts.

    Animated frame by frame rather than by scaling a single ring: a pixel-art
    ring scaled continuously lands between pixels and turns to mush. Each ring
    radius is its own set of rects, swapped with calcMode="discrete" so every
    frame stays pixel-perfect.

    Timeline over 2.6 s (fractions of the cycle in keyTimes below):
      0.00-0.55  wide approach ring
      0.55-1.10  mid approach ring
      1.10-1.35  ring meets the target: white flash, target swells
      1.35-2.10  burst, three frames of particles travelling outwards
      2.25-2.60  target back, ready for the next note
    palette: ring #ff5edb | target #4dd8ff | flash/highlight #ffffff
  -->

  <!-- ================= approach ring, wide (r = 7) ================= -->
  <g opacity="0">
    <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite"
             calcMode="discrete" keyTimes="0;0.2115;1" values="1;0;0"/>
    <rect x="6" y="0" width="4" height="1" fill="#ff5edb"/>
    <rect x="4" y="1" width="2" height="1" fill="#ff5edb"/>
    <rect x="10" y="1" width="2" height="1" fill="#ff5edb"/>
    <rect x="3" y="2" width="1" height="1" fill="#ff5edb"/>
    <rect x="12" y="2" width="1" height="1" fill="#ff5edb"/>
    <rect x="2" y="3" width="1" height="1" fill="#ff5edb"/>
    <rect x="13" y="3" width="1" height="1" fill="#ff5edb"/>
    <rect x="1" y="4" width="1" height="2" fill="#ff5edb"/>
    <rect x="14" y="4" width="1" height="2" fill="#ff5edb"/>
    <rect x="0" y="6" width="1" height="4" fill="#ff5edb"/>
    <rect x="15" y="6" width="1" height="4" fill="#ff5edb"/>
    <rect x="1" y="10" width="1" height="2" fill="#ff5edb"/>
    <rect x="14" y="10" width="1" height="2" fill="#ff5edb"/>
    <rect x="2" y="12" width="1" height="1" fill="#ff5edb"/>
    <rect x="13" y="12" width="1" height="1" fill="#ff5edb"/>
    <rect x="3" y="13" width="1" height="1" fill="#ff5edb"/>
    <rect x="12" y="13" width="1" height="1" fill="#ff5edb"/>
    <rect x="4" y="14" width="2" height="1" fill="#ff5edb"/>
    <rect x="10" y="14" width="2" height="1" fill="#ff5edb"/>
    <rect x="6" y="15" width="4" height="1" fill="#ff5edb"/>
  </g>

  <!-- ================= approach ring, mid (r = 5) ================= -->
  <g opacity="0">
    <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite"
             calcMode="discrete" keyTimes="0;0.2115;0.4231;1" values="0;1;0;0"/>
    <rect x="6" y="3" width="4" height="1" fill="#ff5edb"/>
    <rect x="4" y="4" width="2" height="1" fill="#ff5edb"/>
    <rect x="10" y="4" width="2" height="1" fill="#ff5edb"/>
    <rect x="3" y="5" width="1" height="6" fill="#ff5edb"/>
    <rect x="12" y="5" width="1" height="6" fill="#ff5edb"/>
    <rect x="4" y="11" width="2" height="1" fill="#ff5edb"/>
    <rect x="10" y="11" width="2" height="1" fill="#ff5edb"/>
    <rect x="6" y="12" width="4" height="1" fill="#ff5edb"/>
  </g>

  <!-- ========= the ring meets the target: white flash (r = 4) ========= -->
  <g opacity="0">
    <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite"
             calcMode="discrete" keyTimes="0;0.4231;0.5192;1" values="0;1;0;0"/>
    <rect x="6" y="4" width="4" height="1" fill="#ffffff"/>
    <rect x="5" y="5" width="1" height="1" fill="#ffffff"/>
    <rect x="10" y="5" width="1" height="1" fill="#ffffff"/>
    <rect x="4" y="6" width="1" height="4" fill="#ffffff"/>
    <rect x="11" y="6" width="1" height="4" fill="#ffffff"/>
    <rect x="5" y="10" width="1" height="1" fill="#ffffff"/>
    <rect x="10" y="10" width="1" height="1" fill="#ffffff"/>
    <rect x="6" y="11" width="4" height="1" fill="#ffffff"/>
  </g>

  <!-- ================= target, at rest ================= -->
  <g opacity="1">
    <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite"
             calcMode="discrete" keyTimes="0;0.4231;0.8654;1" values="1;0;1;1"/>
    <rect x="6" y="5" width="4" height="1" fill="#4dd8ff"/>
    <rect x="5" y="6" width="6" height="4" fill="#4dd8ff"/>
    <rect x="6" y="10" width="4" height="1" fill="#4dd8ff"/>
    <rect x="6" y="6" width="2" height="1" fill="#ffffff"/>
    <rect x="6" y="7" width="1" height="1" fill="#ffffff"/>
  </g>

  <!-- ======== target on the beat: swollen and blown out to white ======== -->
  <g opacity="0">
    <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite"
             calcMode="discrete" keyTimes="0;0.4231;0.5192;1" values="0;1;0;0"/>
    <rect x="6" y="5" width="4" height="1" fill="#ffffff"/>
    <rect x="5" y="6" width="6" height="4" fill="#ffffff"/>
    <rect x="6" y="10" width="4" height="1" fill="#ffffff"/>
  </g>

  <!-- ================= burst, frame 1 ================= -->
  <g opacity="0">
    <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite"
             calcMode="discrete" keyTimes="0;0.5192;0.6154;1" values="0;1;0;0"/>
    <rect x="7" y="3" width="2" height="1" fill="#ffffff"/>
    <rect x="7" y="12" width="2" height="1" fill="#ffffff"/>
    <rect x="3" y="7" width="1" height="2" fill="#ffffff"/>
    <rect x="12" y="7" width="1" height="2" fill="#ffffff"/>
    <rect x="5" y="5" width="1" height="1" fill="#4dd8ff"/>
    <rect x="10" y="5" width="1" height="1" fill="#4dd8ff"/>
    <rect x="5" y="10" width="1" height="1" fill="#4dd8ff"/>
    <rect x="10" y="10" width="1" height="1" fill="#4dd8ff"/>
    <rect x="7" y="7" width="2" height="2" fill="#ffffff"/>
  </g>

  <!-- ================= burst, frame 2 ================= -->
  <g opacity="0">
    <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite"
             calcMode="discrete" keyTimes="0;0.6154;0.7115;1" values="0;1;0;0"/>
    <rect x="7" y="1" width="2" height="1" fill="#4dd8ff"/>
    <rect x="7" y="14" width="2" height="1" fill="#4dd8ff"/>
    <rect x="1" y="7" width="1" height="2" fill="#4dd8ff"/>
    <rect x="14" y="7" width="1" height="2" fill="#4dd8ff"/>
    <rect x="3" y="3" width="1" height="1" fill="#ff5edb"/>
    <rect x="12" y="3" width="1" height="1" fill="#ff5edb"/>
    <rect x="3" y="12" width="1" height="1" fill="#ff5edb"/>
    <rect x="12" y="12" width="1" height="1" fill="#ff5edb"/>
  </g>

  <!-- ================= burst, frame 3 (fading out) ================= -->
  <g opacity="0">
    <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite"
             calcMode="discrete" keyTimes="0;0.7115;0.8077;1" values="0;0.55;0;0"/>
    <rect x="7" y="0" width="2" height="1" fill="#4dd8ff"/>
    <rect x="7" y="15" width="2" height="1" fill="#4dd8ff"/>
    <rect x="0" y="7" width="1" height="2" fill="#4dd8ff"/>
    <rect x="15" y="7" width="1" height="2" fill="#4dd8ff"/>
    <rect x="2" y="2" width="1" height="1" fill="#ff5edb"/>
    <rect x="13" y="2" width="1" height="1" fill="#ff5edb"/>
    <rect x="2" y="13" width="1" height="1" fill="#ff5edb"/>
    <rect x="13" y="13" width="1" height="1" fill="#ff5edb"/>
  </g>

  <!--
    The next note growing back in. Without this frame the loop goes fully blank
    for ~0.15 s between the last particles and the target returning, which reads
    as a flicker at README size.
  -->
  <g opacity="0">
    <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite"
             calcMode="discrete" keyTimes="0;0.8077;0.8654;1" values="0;1;0;0"/>
    <rect x="6" y="6" width="4" height="4" fill="#4dd8ff"/>
  </g>
</svg>
