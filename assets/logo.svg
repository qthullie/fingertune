<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="256" height="256" shape-rendering="crispEdges">
  <!-- fingertune pixel pinch — original artwork, MIT licensed with the project -->
  <!-- palette -->
  <!-- skin: #f2b183 | skin light: #ffd0ae | skin shade: #cf8b63 -->
  <!-- approach ring: #ff5edb | spark: #4dd8ff | spark core: #ffffff -->

  <!-- approach ring (open on the left: the fingers come in through the gap) -->
  <rect x="7" y="3" width="3" height="1" fill="#ff5edb"/>
  <rect x="10" y="4" width="1" height="1" fill="#ff5edb"/>
  <rect x="11" y="5" width="1" height="1" fill="#ff5edb"/>
  <rect x="12" y="6" width="1" height="4" fill="#ff5edb"/>
  <rect x="11" y="10" width="1" height="1" fill="#ff5edb"/>
  <rect x="10" y="11" width="1" height="1" fill="#ff5edb"/>
  <rect x="7" y="12" width="3" height="1" fill="#ff5edb"/>

  <!-- index finger, coming down from the top-left -->
  <rect x="1" y="2" width="4" height="1" fill="#ffd0ae"/>
  <rect x="2" y="3" width="4" height="1" fill="#f2b183"/>
  <rect x="3" y="4" width="3" height="1" fill="#f2b183"/>
  <rect x="4" y="5" width="3" height="1" fill="#f2b183"/>
  <rect x="6" y="6" width="1" height="1" fill="#f2b183"/>
  <rect x="1" y="3" width="1" height="1" fill="#cf8b63"/>
  <rect x="3" y="5" width="1" height="1" fill="#cf8b63"/>

  <!-- thumb, coming up from the bottom-left -->
  <rect x="1" y="13" width="4" height="1" fill="#cf8b63"/>
  <rect x="2" y="12" width="4" height="1" fill="#f2b183"/>
  <rect x="3" y="11" width="3" height="1" fill="#f2b183"/>
  <rect x="4" y="10" width="3" height="1" fill="#f2b183"/>
  <rect x="6" y="9" width="1" height="1" fill="#f2b183"/>
  <rect x="1" y="12" width="1" height="1" fill="#ffd0ae"/>
  <rect x="3" y="10" width="1" height="1" fill="#ffd0ae"/>

  <!-- the hit spark, caught between the fingertips -->
  <rect x="8" y="6" width="2" height="1" fill="#4dd8ff"/>
  <rect x="7" y="7" width="1" height="2" fill="#4dd8ff"/>
  <rect x="10" y="7" width="1" height="2" fill="#4dd8ff"/>
  <rect x="8" y="9" width="2" height="1" fill="#4dd8ff"/>
  <rect x="8" y="7" width="2" height="2" fill="#ffffff"/>
</svg>
