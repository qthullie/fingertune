name: Deploy to GitHub Pages

# One-time setup, required before this workflow can succeed:
#   Settings > Pages > Source = "GitHub Actions"
#
# It cannot be automated from here: creating the Pages site through the API
# needs repository-admin rights, which the workflow's GITHUB_TOKEN does not
# have ("Resource not accessible by integration").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# `cancel-in-progress: false` on purpose, and it is the opposite of what the
# setting is usually for.
#
# A Pages deployment is not confined to this workflow: `deploy-pages` asks
# GitHub to publish and then waits for that to finish elsewhere. Cancelling the
# job mid-flight therefore abandons a deployment that the Pages pipeline still
# considers live, and every later one queues behind it -- which shows up here
# as `deployment_queued` forever, then a timeout, on a build that succeeded.
#
# Two pushes in quick succession is all it takes. The cost of not cancelling is
# one redundant build; the cost of cancelling is a stuck queue.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ship the model with the site: no dependency on Google's CDN at runtime.
      - run: npm run fetch:model
      - run: echo "VITE_HAND_MODEL_URL=./models/hand_landmarker.task" >> .env.production

      # The online board, if one is configured. Repository VARIABLES, not
      # secrets, and that is the honest labelling: the anon key ends up in the
      # JavaScript bundle by design, so calling it a secret would teach the
      # wrong lesson about where the boundary is. It is
      # supabase/migrations/0001_scores.sql that constrains what the key can do.
      #
      # Undefined variables expand to empty strings, the game reports the board
      # as not configured, and the site deploys exactly as it did before. A
      # missing backend is a working configuration here.
      #
      # Settings > Secrets and variables > Actions > Variables:
      #   SUPABASE_URL, SUPABASE_ANON_KEY
      - name: Configure the online board
        run: |
          echo "VITE_SUPABASE_URL=${{ vars.SUPABASE_URL }}" >> .env.production
          echo "VITE_SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}" >> .env.production

      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Ten minutes is the default, and it is the value that timed out. The
          # Pages queue can genuinely take longer after it has been disturbed,
          # and failing early on a build that is fine helps nobody.
          timeout: 1200000
