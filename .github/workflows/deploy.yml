name: Deploy to GitHub Pages

# Manual only, on purpose.
#
# GitHub Pages has to be enabled on the repository first, and on the free plan
# that requires the repository to be public. Running this on every push while
# Pages is off just produces a red X on every commit ("Get Pages site failed").
#
# Once the repository is public: Settings > Pages > Source = "GitHub Actions",
# then run this workflow from the Actions tab. Switch back to `on: push` if you
# want every commit deployed.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ship the model with the site: no dependency on Google's CDN at runtime.
      - run: npm run fetch:model
      - run: echo "VITE_HAND_MODEL_URL=./models/hand_landmarker.task" >> .env.production

      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on if it is not already, instead of failing.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
