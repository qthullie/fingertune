name: Deploy to GitHub Pages

# Publie le build Vite sur GitHub Pages a chaque push sur main.
# Prerequis cote repo : Settings > Pages > Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Heberge le modele avec le site : pas de dependance au CDN Google a l'execution.
      - run: npm run fetch:model
      - run: echo "VITE_HAND_MODEL_URL=./models/hand_landmarker.task" >> .env.production

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
