name: Deploy to GitHub Pages

# One-time setup, required before this workflow can succeed:
#   Settings > Pages > Source = "GitHub Actions"
#
# It cannot be automated from here: creating the Pages site through the API
# needs repository-admin rights, which the workflow's GITHUB_TOKEN does not
# have ("Resource not accessible by integration").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ship the model with the site: no dependency on Google's CDN at runtime.
      - run: npm run fetch:model
      - run: echo "VITE_HAND_MODEL_URL=./models/hand_landmarker.task" >> .env.production

      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
